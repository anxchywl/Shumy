document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
$('gameBrand').textContent = t('game');
$('lobby').querySelector('h1').textContent = playerLocale === 'en' ? 'You’re in!' : playerLocale === 'kk' ? 'Ойынға қосылдың!' : 'Ты в игре!';
document.title = `${t('game')} · Shumy`;
if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
  $('homeLink').href = `${location.protocol}//${location.hostname}:8080/`;
}
const stored = key => {
  try { return localStorage.getItem(key); } catch { return null; }
};
const save = (key, value) => {
  try { localStorage.setItem(key, value); } catch {}
};
const pid = stored('kto.pid') || (crypto.randomUUID?.() ??
  Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, '0')).join(''));
save('kto.pid', pid);
$('name').value = stored('kto.name') || '';
const room = (embedParameters.get('room') || '').toUpperCase();
const hasRoom = /^[A-HJ-NP-Z2-9]{8}$/.test(room);

let state = null;
let connected = false;
let joining = false;
let pendingVote = null;
let screen = 'join';
let embeddedJoinNotified = false;
let optionsKey = '';
// without a room code there is nothing to listen to yet, the sketch board still needs an event source
const events = hasRoom ? new EventSource('./events?' + new URLSearchParams({ room, pid })) : new EventTarget();
events.addEventListener('missing', () => {
  events.close();
  askForRoom(playerLocale === 'en' ? 'Room not found. Check the code on the host screen.' : playerLocale === 'kk' ? 'Бөлме табылмады. Жүргізуші экранындағы кодты тексер.' : 'Нет такой комнаты. Проверь код на экране ведущего');
});
const drawCanvas = $('drawCanvas');
const drawBoard = Sketch.board(drawCanvas, events);
const drawClock = Sketch.clock($('drawClock'));
let drawTurn = null;
let canDraw = false;
let pointer = null;
let lastPoint = null;
let color = 0;
let width = 11;
let inkQueue = [];
let inkBusy = false;
let clearQueued = false;
let guessPending = null;
let guessFeedback = '';

events.onmessage = event => {
  state = JSON.parse(event.data);
  document.documentElement.dataset.gameMode = state.mode === 'draw' ? 'draw' : 'vote';
  const gameName = state.mode === 'draw' ? t('drawGame') : t('game');
  $('gameBrand').textContent = gameName;
  document.title = `${gameName} · Шуми`;
  connected = true;
  render();
};
events.onerror = () => {
  connected = false;
  render();
};

async function post(action, payload, signal) {
  const response = await fetch('./api/' + action, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ room, pid, ...payload }),
    signal,
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || (playerLocale === 'en' ? 'Please try again' : playerLocale === 'kk' ? 'Қайталап көр' : 'Попробуй ещё раз'));
  return result;
}

function playerDot(color) {
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.setProperty('--player', color);
  return dot;
}

function makePill(player) {
  const pill = document.createElement('li');
  pill.className = 'pill' + (player.online ? '' : ' off');
  pill.append(playerDot(player.color), player.name + (player.id === state.selfId ? ' (ты)' : ''));
  return pill;
}

const paletteNames = ['Чёрный', 'Красный', 'Жёлтый', 'Зелёный', 'Синий', 'Фиолетовый', 'Ластик'];
for (const [index, name] of paletteNames.entries()) {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('aria-label', name);
  button.setAttribute('aria-pressed', String(index === color));
  button.title = name;
  const swatch = document.createElement('span');
  swatch.style.setProperty('--brush', Sketch.colors[index]);
  button.append(swatch);
  button.onclick = () => {
    color = index;
    for (const [i, swatchButton] of [...$('palette').children].entries()) {
      swatchButton.setAttribute('aria-pressed', String(i === index));
    }
  };
  $('palette').append(button);
}
$('drawWidth').onclick = () => {
  width = width === 11 ? 23 : width === 23 ? 5 : 11;
  $('drawWidth').textContent = { 5: 'Тонкая кисть', 11: 'Средняя кисть', 23: 'Толстая кисть' }[width];
};

function renderDrawing(me) {
  const turn = state.drawing;
  const revealed = state.phase === 'draw-result';
  if (drawTurn !== turn.id) {
    drawTurn = turn.id;
    inkQueue = [];
    clearQueued = false;
    pointer = null;
    guessPending = null;
    guessFeedback = '';
    $('guessInput').value = '';
  }
  drawBoard.select(turn.id);
  drawClock(state.remainingMs);
  $('drawClock').hidden = revealed;
  const artist = turn.artist === me.id;
  const solved = turn.solved.includes(me.id);
  const playing = state.drawRoute.some(player => player.id === me.id);
  const artistName = state.drawRoute.find(player => player.id === turn.artist).name;
  canDraw = artist && !revealed && connected;
  $('drawRound').textContent = `Ход ${state.round} из ${state.totalRounds}`;
  $('drawHeading').textContent = revealed ? turn.word : artist ? state.secretWord : `Рисует ${artistName}`;
  $('drawClue').textContent = revealed ? 'Ответ' : artist ? 'Твоё секретное слово' : `${turn.category} / ${turn.mask}`;
  $('drawClue').className = revealed || artist ? 'muted' : 'sketch-mask';
  drawCanvas.classList.toggle('editable', canDraw);
  $('drawTools').hidden = !artist || revealed;
  $('drawClear').disabled = !canDraw || clearQueued;
  $('guessForm').hidden = artist || revealed || solved || !playing;
  $('guessButton').disabled = !connected || !!guessPending;
  const gain = turn.gained[me.id] ?? 0;
  $('guessFeedback').textContent = revealed ? `+${gain} очков за ход. Всего ${me.score}`
    : artist ? 'Рисуй без букв и цифр'
    : solved ? `Угадано! +${gain} очков`
    : playing ? guessFeedback : 'Вступишь в следующей партии';
}

function addInk(event) {
  const bounds = drawCanvas.getBoundingClientRect();
  const x = Math.max(0, Math.min(960, Math.round((event.clientX - bounds.left) / bounds.width * 960)));
  const y = Math.max(0, Math.min(600, Math.round((event.clientY - bounds.top) / bounds.height * 600)));
  if (lastPoint?.[0] === x && lastPoint[1] === y) return;
  const segment = [color, color === 6 ? 23 : width, ...(lastPoint ?? [x, y]), x, y];
  lastPoint = [x, y];
  if (inkQueue.length >= 576) return;
  inkQueue.push(segment);
  drawBoard.segment(segment);
}
drawCanvas.onpointerdown = event => {
  if (!canDraw || clearQueued || pointer !== null || event.button !== 0) return;
  pointer = event.pointerId;
  lastPoint = null;
  drawCanvas.setPointerCapture(pointer);
  addInk(event);
};
drawCanvas.onpointermove = event => {
  if (canDraw && !clearQueued && pointer === event.pointerId) addInk(event);
};
drawCanvas.onpointerup = drawCanvas.onpointercancel = drawCanvas.onlostpointercapture = event => {
  if (pointer === event.pointerId) pointer = null;
};
$('drawClear').onclick = () => {
  if (!canDraw || clearQueued) return;
  inkQueue = [];
  pointer = null;
  clearQueued = true;
  $('drawClear').disabled = true;
};

setInterval(async () => {
  if (!canDraw || inkBusy || (!inkQueue.length && !clearQueued)) return;
  const turnId = drawTurn;
  const clear = clearQueued;
  const payload = clear ? { turnId, clear } : { turnId, segments: inkQueue.splice(0, 96) };
  inkBusy = true;
  try {
    await post('ink', payload, AbortSignal.timeout(4000));
  } catch (error) {
    if (drawTurn === turnId && canDraw) $('error').textContent = error.message;
  } finally {
    inkBusy = false;
    if (drawTurn === turnId && clear) {
      clearQueued = false;
      $('drawClear').disabled = !canDraw;
    }
  }
}, 50);

$('guessForm').onsubmit = async event => {
  event.preventDefault();
  if (!connected || guessPending || $('guessForm').hidden) return;
  const text = $('guessInput').value.trim();
  if (!text) return;
  const turnId = drawTurn;
  guessPending = turnId;
  $('guessButton').disabled = true;
  try {
    const result = await post('guess', { turnId, text }, AbortSignal.timeout(4000));
    if (drawTurn !== turnId) return;
    guessFeedback = result.correct ? 'Угадано!' : 'Мимо. Попробуй ещё';
    if (!result.correct) $('guessInput').select();
  } catch (error) {
    if (drawTurn === turnId) guessFeedback = error.message;
  } finally {
    if (guessPending === turnId) {
      guessPending = null;
      render();
    }
  }
};

function render() {
  const me = state?.players.find(player => player.id === state.selfId);
  const nextScreen = !me ? 'join' : state.drawing ? 'sketch' : state.phase;
  if (screen !== nextScreen) {
    $('error').textContent = '';
    screen = nextScreen;
    for (const section of screens) section.hidden = section.id !== screen;
  }
  if (embeddedPlayer) {
    document.documentElement.dataset.embed = screen === 'join' ? 'player' : 'active';
    if (screen !== 'join' && !embeddedJoinNotified) {
      embeddedJoinNotified = true;
      window.parent.postMessage({ type:'shumy-player-joined' }, embedParentOrigin);
    }
  }
  $('connection').textContent = connected ? t('connected') : state ? t('connectionLost') : t('connecting');
  $('connection').classList.toggle('is-connected', connected);
  $('joinButton').disabled = joining || !connected;
  $('joinButton').querySelector('span').textContent = joining ? t('joining') : t('joinGame');
  if (screen !== 'sketch') {
    canDraw = false;
    drawTurn = null;
    drawBoard.select(null);
  }

  if (pendingVote && (screen !== 'question' || pendingVote.round !== state.round || me.voted)) pendingVote = null;
  if (screen === 'lobby') {
    $('lobbyMode').textContent = state.mode === 'draw'
      ? (playerLocale === 'en' ? 'Draw and guess. Everyone gets a turn.' : playerLocale === 'kk' ? 'Сурет сал да тап. Әркім кезек алады.' : 'Рисуй и угадывай. У каждого будет один ход')
      : t('waiting');
    $('roster').replaceChildren(...state.players.map(makePill));
  } else if (screen === 'sketch') {
    renderDrawing(me);
  } else if (screen === 'question') {
    $('round').textContent = `Раунд ${state.round} / ${state.totalRounds}`;
    $('prompt').textContent = state.question + '?';
    const options = JSON.stringify(state.players.map(({ id, name, color }) => [id, name, color]));
    if (options !== optionsKey) {
      optionsKey = options;
      $('choices').replaceChildren(...state.players.map(player => {
        const button = document.createElement('button');
        button.append(playerDot(player.color), player.name);
        button.dataset.target = player.id;
        button.style.setProperty('--player', player.color);
        if (player.id === me.id) {
          const tag = document.createElement('small');
          tag.textContent = 'ты';
          button.append(' ', tag);
        }
        return button;
      }));
    }
    $('voted').hidden = !me.voted;
    $('choices').hidden = me.voted;
    for (const button of $('choices').children) button.disabled = !connected || !!pendingVote;
  } else if (screen === 'reveal') {
    $('resultRound').textContent = `Раунд ${state.round} / ${state.totalRounds}`;
    const names = state.results.winners.map(id => state.players.find(player => player.id === id)?.name || 'Игрок вышел');
    $('winners').textContent = names.length ? `Больше всего голосов: ${names.join(', ')}` : 'Никто не проголосовал';
    $('gained').textContent = '+' + (state.results.gained[me.id] ?? 0);
    $('roundTotal').textContent = `Всего очков: ${me.score}`;
  } else if (screen === 'final') {
    const ranked = state.players.filter(p => state.mode !== 'draw' || state.drawRoute.some(player => player.id === p.id))
      .sort((a, b) => b.score - a.score);
    const place = ranked.indexOf(me) + 1;
    $('place').textContent = place ? `${place}-е место` : 'Ты в лобби';
    $('finalScore').textContent = place ? `Всего очков: ${me.score}` : 'Сможешь сыграть в следующей партии';
  }
}

function askForRoom(message = '') {
  $('roomForm').hidden = false;
  $('joinForm').hidden = true;
  document.querySelector('#join h1').textContent = t('enterCode');
  document.querySelector('#join .join-copy').textContent = t('codeVisible');
  $('error').textContent = message;
}
if (!hasRoom) askForRoom();

// the page reloads with the code so the game connects to that room
$('roomForm').onsubmit = event => {
  event.preventDefault();
  const code = $('roomInput').value.trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) {
    $('error').textContent = t('invalidCode');
    $('roomInput').focus();
    return;
  }
  const params = new URLSearchParams(location.search);
  params.set('room', code);
  location.search = params;
};

$('joinForm').onsubmit = async event => {
  event.preventDefault();
  if (joining || !connected) return;
  const name = $('name').value.trim();
  if (!name) {
    $('error').textContent = t('enterNameError');
    $('name').focus();
    return;
  }
  joining = true;
  $('error').textContent = '';
  render();
  try {
    const result = await post('join', { name });
    save('kto.name', result.name);
    $('name').value = result.name;
  } catch (error) {
    $('error').textContent = error instanceof TypeError ? t('noConnection') : error.message;
  } finally {
    joining = false;
    render();
  }
};

$('choices').onclick = async event => {
  const target = event.target.closest('button')?.dataset.target;
  if (!target || !connected || pendingVote || screen !== 'question') return;
  const vote = { target, round:state.round };
  pendingVote = vote;
  $('error').textContent = '';
  render();
  try {
    await post('vote', vote);
  } catch (error) {
    if (pendingVote !== vote) return;
    pendingVote = null;
    $('error').textContent = error instanceof TypeError ? 'Нет связи с сервером. Попробуй ещё раз.' : error.message;
    render();
  }
};
</script>
</body>
</html>
